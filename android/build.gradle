// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Ninja runs one compiler per CPU core for every native (CMake) module. With skia, reanimated
// and worklets that runs the EAS worker out of memory and the Gradle daemon gets killed.
// Cap native compile and link jobs at 2 in every Android module.
subprojects {
  ['com.android.application', 'com.android.library'].each { pluginId ->
    plugins.withId(pluginId) {
      android.defaultConfig.externalNativeBuild.cmake.arguments(
        '-DCMAKE_JOB_POOLS=native=2',
        '-DCMAKE_JOB_POOL_COMPILE=native',
        '-DCMAKE_JOB_POOL_LINK=native'
      )
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
